# =========================
# Configuracion del servidor
# =========================
server.port=8080
server.address=0.0.0.0

# Si esta aplicacion se despliega detras de un reverse proxy o balanceador
# de confianza (Nginx, Cloudflare, un load balancer, etc.), descomenta la
# siguiente linea. Sin ella, HttpServletRequest.getRemoteAddr() (usado por
# LoginRateLimiterService para el rate limiting de login por IP+usuario)
# devuelve siempre la IP del proxy, la misma para todo el trafico: un
# atacante que falla 5 intentos bloquearia esa clave para TODOS los
# usuarios reales detras del mismo proxy. Con "native", el servidor
# embebido (Tomcat) resuelve la IP real del cliente a partir del header
# X-Forwarded-For, pero SOLO confiando en el proxy inmediato (no en
# cualquier cliente que decida mandar ese header el mismo). NO actives
# esto si la aplicacion recibe trafico directo de internet sin proxy
# delante: en ese caso el codigo actual (sin esta linea) es lo correcto,
# porque cualquiera podria falsificar X-Forwarded-For para evadir el
# rate limiter.
# server.forward-headers-strategy=native

# El frontend Angular usa JWT y puede desplegarse en otro servidor.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Lista separada por comas de orígenes autorizados para consumir la API.
# Ejemplo: https://cec.upse.edu.ec,http://10.0.0.20
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:4200}

# =========================
# Base de datos PostgreSQL
# =========================
# DB_URL / DB_USERNAME / DB_PASSWORD deben definirse como variables de
# entorno (o en un application-local.properties fuera de git). No hay
# valores por defecto para el usuario/contraseña a propósito: si faltan,
# el arranque debe fallar en vez de usar credenciales reales hardcodeadas.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cec_capacitacion}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Flyway (migraciones de base de datos)
# =========================
# Reemplaza el mecanismo anterior (spring.sql.init + schema-actual.sql +
# tabla casera cec_migraciones). Las migraciones viven en
# src/main/resources/db/migration, numeradas V1, V2, V3...
#
# baseline-on-migrate=true + baseline-version=1: en una base de datos que
# YA tiene las tablas (como la de producción, restaurada desde el backup),
# Flyway no vuelve a correr V1 — simplemente la marca como aplicada la
# primera vez que arranca. En una base de datos nueva y vacía (ej. un
# entorno de pruebas), si corre normalmente: crea todo desde cero con V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema previo a adoptar Flyway

# =========================
# Carga de archivos
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Carpeta donde se guardan fisicamente los documentos subidos.
# En el servidor de produccion, definir APP_UPLOAD_DIR como una ruta
# ABSOLUTA (ej. /var/upse-cec/uploads) fuera de la carpeta donde vive el
# .jar, para que sobreviva a redeploys sin importar desde donde se lance
# el proceso. Localmente se inicia desde backend-springboot y se usa la
# carpeta uploads conservada en la raíz del proyecto separado.
app.upload.dir=${APP_UPLOAD_DIR:../uploads}

# =========================
# Correo
# =========================
# MAIL_USERNAME / MAIL_PASSWORD (app password de Gmail, no la contraseña
# normal de la cuenta) también deben venir de variables de entorno.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.remitente-nombre=Centro de Educacion Continua UPSE

# =========================
# Documentación de la API (OpenAPI / Swagger UI)
# =========================
# DESHABILITADA por defecto: exponer el catálogo completo de endpoints en
# producción le ahorra trabajo a quien busque puntos débiles. Para
# consultarla en desarrollo o en un ambiente de pruebas, definir
# SWAGGER_ENABLED=true. Con eso quedan disponibles:
#   /swagger-ui.html   (interfaz; usar "Authorize" con el JWT del login)
#   /v3/api-docs       (especificación OpenAPI en JSON)
# La documentación es pública SOLO mientras está habilitada; los endpoints
# siguen exigiendo su JWT y su rol como siempre.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
