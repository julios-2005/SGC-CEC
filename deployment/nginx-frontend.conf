# Redirige todo el tráfico HTTP a HTTPS.
server {
    listen 80;
    server_name sgc.cec.upse.edu.ec;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sgc.cec.upse.edu.ec;

    # Rutas de certificado a ajustar según lo que entregue TIC
    # (ej. Let's Encrypt: /etc/letsencrypt/live/sgc.cec.upse.edu.ec/).
    ssl_certificate     /etc/ssl/sgc-cec/fullchain.pem;
    ssl_certificate_key /etc/ssl/sgc-cec/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/sgc-cec-angular/browser;
    index index.html;

    # Cabeceras de seguridad. IMPORTANTE (particularidad de Nginx): un
    # "location" que define su propio add_header deja de heredar los
    # add_header del bloque "server" (no se combinan, se reemplazan por
    # completo) — por eso estas mismas líneas se repiten en cada location
    # de abajo que ya trae sus propios Cache-Control, y no solo aquí.
    #
    # connect-src debe incluir el dominio real del backend (el mismo que
    # apiBaseUrl en config.js); si el dominio de la API cambia, actualízalo
    # también aquí.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.sgc.cec.upse.edu.ec; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.sgc.cec.upse.edu.ec; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    location ~ ^/(?:index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.sgc.cec.upse.edu.ec; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.sgc.cec.upse.edu.ec; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }
}
