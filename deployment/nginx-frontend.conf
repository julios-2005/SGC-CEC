# Redirige todo el tráfico HTTP a HTTPS.
server {
    listen 80;
    server_name sgccec.upse.edu.ec;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sgccec.upse.edu.ec;

    # Rutas de certificado a ajustar según lo que entregue TIC
    # (certificado institucional único para sgccec.upse.edu.ec).
    ssl_certificate     /etc/ssl/sgc-cec/fullchain.pem;
    ssl_certificate_key /etc/ssl/sgc-cec/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/sgc-cec-angular/browser;
    index index.html;

    # El backend admite 25 MB de multipart (5 MB por archivo). El valor por
    # defecto de Nginx es 1 MB y rechazaría las inscripciones con comprobantes.
    client_max_body_size 26m;

    # Cabeceras de seguridad. IMPORTANTE (particularidad de Nginx): un
    # "location" que define su propio add_header deja de heredar los
    # add_header del bloque "server" (no se combinan, se reemplazan por
    # completo) — por eso estas mismas líneas se repiten en cada location
    # de abajo que ya trae sus propios Cache-Control, y no solo aquí.
    #
    # Arquitectura de dominio único (Same-Origin): el navegador solo habla con
    # este dominio y Nginx reenvía /api al backend por la red interna, por eso
    # connect-src solo necesita 'self'. Si el API se publicara en otro dominio,
    # habría que añadirlo aquí y a FRONTEND_ORIGINS (CORS) del backend.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    location ~ ^/(?:index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    # API (Servidor 2, Spring Boot). "^~" es obligatorio: sin él, las rutas del
    # API que terminan en .png/.jpg/.pdf (imágenes de cursos y documentos)
    # coincidirían con la regla de archivos estáticos de más abajo y devolverían
    # 404 en lugar de llegar al backend.
    # Sustituye IP_SERVIDOR_BACKEND por la IP privada del Servidor 2.
    location ^~ /api/ {
        proxy_pass http://IP_SERVIDOR_BACKEND:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr y NO $proxy_add_x_forwarded_for: no se hereda lo que envíe
        # el cliente, así nadie falsea su IP para evadir los límites de intentos.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }
}
